AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub OIDC Provider and IAM Role for GitHub Actions deployment'

Parameters:
  ProjectName:
    Type: String
    Description: Name of the project/application
    AllowedPattern: ^[a-z0-9\-]{3,20}$
  GitHubOrg:
    Type: String
    Description: 'GitHub organization or username'
  GitHubRepo:
    Type: String
    Description: 'GitHub repository name'
  OIDCProviderArn:
    Type: String
    Description: 'ARN of the GitHub OIDC Provider (if it already exists)'
    Default: ''

Conditions:
  CreateOIDCProvider: !Equals [!Ref OIDCProviderArn, '']

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Ref OIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:*'
      ManagedPolicyArns:
        - !Ref GitHubActionsPolicy
      Tags:
        - Key: Solution
          Value: !Ref ProjectName

  GitHubActionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Stack-scoped actions: nested stacks (CustomResourceStack,
          # AcmCertificateStack, CloudFrontStack) are physically named
          # ${ParentStackName}-${LogicalId}-${suffix}, so they still match
          # this project's stack-name prefix.
          - Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:CreateChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:GetTemplate
            Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-*/*'
          # Not stack-scoped: these act on a template body/S3 URL directly,
          # not an existing stack ARN, so they don't support resource-level
          # permissions.
          - Effect: Allow
            Action:
              - cloudformation:GetTemplateSummary
              - cloudformation:ValidateTemplate
              - cloudformation:Package
              - cloudformation:Deploy
            Resource: '*'
          - Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetBucketEncryption
              - s3:PutBucketEncryption
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketLogging
              - s3:PutBucketLogging
              - s3:GetBucketWebsite
              - s3:PutBucketWebsite
              - s3:DeleteBucketWebsite
              - s3:PutBucketOwnershipControls
              - s3:PutBucketTagging
              - s3:GetBucketTagging
              - s3:PutEncryptionConfiguration
              - s3:GetBucketAcl
              - s3:PutBucketAcl
            Resource:
              - !Sub 'arn:aws:s3:::${ProjectName}-*'
              - !Sub 'arn:aws:s3:::${ProjectName}-*/*'
          # Scoped to this project's hosted zone. ListHostedZones and
          # GetChange don't support resource-level permissions (the former
          # is account-wide, the latter references a change id, not a zone).
          - Effect: Allow
            Action:
              - route53:GetHostedZone
              - route53:ChangeResourceRecordSets
              - route53:ListResourceRecordSets
            Resource: 'arn:aws:route53:::hostedzone/Z00295123IDZ7CVMX671W'
          - Effect: Allow
            Action:
              - route53:ListHostedZones
              - route53:GetChange
            Resource: '*'
          - Effect: Allow
            Action:
              - acm:RequestCertificate
              - acm:DescribeCertificate
              - acm:DeleteCertificate
              - acm:ListCertificates
              - acm:AddTagsToCertificate
              - acm:RemoveTagsFromCertificate
              - acm:GetCertificate
              - acm:ListTagsForCertificate
            Resource: !Sub 'arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/*'
          - Effect: Allow
            Action:
              - cloudfront:CreateDistribution
              - cloudfront:UpdateDistribution
              - cloudfront:DeleteDistribution
              - cloudfront:GetDistribution
              - cloudfront:ListDistributions
              - cloudfront:CreateInvalidation
              - cloudfront:GetInvalidation
              - cloudfront:ListInvalidations
              - cloudfront:TagResource
              - cloudfront:UntagResource
            Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/*'
          - Effect: Allow
            Action:
              - cloudfront:CreateOriginAccessControl
              - cloudfront:UpdateOriginAccessControl
              - cloudfront:DeleteOriginAccessControl
              - cloudfront:GetOriginAccessControl
              - cloudfront:ListOriginAccessControls
            Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:origin-access-control/*'
          - Effect: Allow
            Action:
              - cloudfront:CreateResponseHeadersPolicy
              - cloudfront:UpdateResponseHeadersPolicy
              - cloudfront:DeleteResponseHeadersPolicy
              - cloudfront:GetResponseHeadersPolicy
              - cloudfront:ListResponseHeadersPolicies
            Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:response-headers-policy/*'
          # For ViewerRequestFunction in cloudfront-site.yaml (the www-apex
          # redirect and directory-index rewrite).
          - Effect: Allow
            Action:
              - cloudfront:CreateFunction
              - cloudfront:UpdateFunction
              - cloudfront:DeleteFunction
              - cloudfront:DescribeFunction
              - cloudfront:GetFunction
              - cloudfront:PublishFunction
              - cloudfront:ListFunctions
            Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:function/*'
          # For HtmlCachePolicy and AssetsCachePolicy in cloudfront-site.yaml.
          - Effect: Allow
            Action:
              - cloudfront:CreateCachePolicy
              - cloudfront:UpdateCachePolicy
              - cloudfront:DeleteCachePolicy
              - cloudfront:GetCachePolicy
              - cloudfront:ListCachePolicies
            Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:cache-policy/*'
          - Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: '*'

Outputs:
  GitHubActionsRoleArn:
    Description: 'ARN of the GitHub Actions IAM Role'
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsRoleArn'

  OIDCProviderArn:
    Description: 'ARN of the GitHub OIDC Provider'
    Value: !If
      - CreateOIDCProvider
      - !Ref GitHubOIDCProvider
      - !Ref OIDCProviderArn
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderArn'
