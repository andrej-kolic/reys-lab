# Push to main deploys straight to production content — staging is reserved
# for testing infra changes (the redirect function, CSP, cache rules), not
# every ordinary content push. workflow_dispatch still covers ad-hoc staging
# or production deploys.
name: Deploy AWS content

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy-content:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (includes the design-rules gate)
        run: pnpm run build

      - name: Deploy content to ${{ github.event.inputs.environment || 'production' }}
        uses: ./deploy/aws/.github/actions/deploy
        with:
          environment: ${{ github.event.inputs.environment || 'production' }}
          action: content
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}
