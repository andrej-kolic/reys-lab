# cfn_nag scans the CloudFormation templates for common misconfigurations.
# It only fails the build on a FAIL-severity finding (none currently exist).
# WARN-severity findings print but never fail the build — e.g. W13 on
# github-oidc.yaml's intentionally account-wide ARNs (ValidateTemplate,
# ListHostedZones, etc. — see that file's own comments for why).
name: Lint AWS templates

on:
  pull_request:
    paths:
      - 'deploy/aws/templates/**'
      - 'deploy/aws/ci/cfn_nag_blacklist.yaml'
      - '.github/workflows/lint-aws-templates.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cfn-nag:
    name: cfn_nag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install cfn_nag
        run: gem install cfn-nag

      - name: Scan templates
        run: cfn_nag deploy/aws/templates/*.yaml --blacklist-path deploy/aws/ci/cfn_nag_blacklist.yaml
