<svg xmlns="http://www.w3.org/2000/svg" width="680" height="426.6" viewBox="0 0 680 426.6" role="img" aria-labelledby="what-title what-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-rendering="geometricPrecision">
  <title id="what-title">Grounder — Obsidian vault memory for Cursor and Claude Code</title>
  <desc id="what-desc">Cursor, Claude Code, and more agents on the left are connected by a two-way arrow to the vault on the right, labelled skills above and CLI below. The vault is a folder tree: 10-Projects, your-project, and inside it plans (updated across sessions), notes (always a new file), and logs (saved session summaries). Caption: any agent, one vault, only when you ask.</desc>

  <defs>
    <radialGradient id="glow" cx="340" cy="213.3" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2150"/>
      <stop offset="0.5" stop-color="#181B3E"/>
      <stop offset="1" stop-color="#141631"/>
    </radialGradient>
    <symbol id="folder" viewBox="0 0 16 13">
      <path class="folder" d="M1.2 2.6q0-1.4 1.4-1.4h3.4l1.5 1.9h5.9q1.4 0 1.4 1.4v5.9q0 1.4-1.4 1.4H2.2q-1 0-1-1.4z"/>
    </symbol>
  </defs>

  <!-- Navy, in Rookie Trader's theme colours (its packages/ui), so the
       project cards read as one set. Overrides experiment 05's teal.
       680 wide, the card band's 16:10: three columns of 196 / 216 / 196
       between 36 margins. Mono text is 15px so your-project/ fits the vault. -->
  <style>
    .bg { fill: #141631; }
    .glow { fill: url(#glow); }
    .frame { fill: none; stroke: #B5A6FF; stroke-opacity: 0.18; stroke-width: 1.35; } /* the site's --lab-frame */
    .card { fill: #202445; stroke: #363A66; stroke-width: 1.35; }
    .card-dash { fill: none; stroke: #363A66; stroke-width: 1.35; stroke-dasharray: 5.4 6.3; }
    .panel { fill: #202445; stroke: #363A66; stroke-width: 1.35; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .kicker { fill: #4CC9F0; font-size: 19px; font-weight: 600; letter-spacing: 2.58px; }
    .name { fill: #ECEEFA; font-size: 15px; font-weight: 600; }
    .more { fill: #9CA1BD; font-size: 15px; font-weight: 500; }
    .caption { fill: #AAAFCF; font-size: 16px; font-weight: 500; }
    .file { fill: #ECEEFA; font-size: 15px; }

    .arrow { fill: none; stroke: #AAAFCF; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tree { fill: none; stroke: #373B68; stroke-width: 1.26; }
    .folder { fill: none; stroke: #4CC9F0; stroke-width: 1.08; }
    .rule { fill: none; stroke: #363A66; stroke-width: 0.9; }
  </style>

  <rect class="bg" width="680" height="426.6" rx="18"/>
  <rect class="glow" width="680" height="426.6" rx="18"/>
  <rect class="frame" x="0.675" y="0.675" width="678.65" height="425.25" rx="17.55"/>

  <!-- agents -->
  <text class="kicker" x="132.5" y="52.2" text-anchor="middle">AGENTS</text>
  <rect class="card" x="36" y="75.6" width="196" height="64.8" rx="12.6"/>
  <text class="name mono" x="134" y="113.3" text-anchor="middle">Cursor</text>
  <rect class="card" x="36" y="158.4" width="196" height="64.8" rx="12.6"/>
  <text class="name mono" x="134" y="196.1" text-anchor="middle">Claude Code</text>
  <rect class="card-dash" x="36" y="241.2" width="196" height="64.8" rx="12.6"/>
  <text class="more" x="134" y="278.9" text-anchor="middle">+ more agents</text>

  <!-- two-way arrow -->
  <text class="kicker" x="340" y="167.4" text-anchor="middle">SKILLS</text>
  <path class="arrow" d="M244 190.8H436"/>
  <path class="arrow" d="M254.6 184.5L242 190.8L254.6 196.8"/>
  <path class="arrow" d="M425.4 184.5L438 190.8L425.4 196.8"/>
  <text class="kicker" x="340" y="230.4" text-anchor="middle">CLI</text>

  <!-- vault: the tree is centred in the panel -->
  <text class="kicker" x="544.5" y="52.2" text-anchor="middle">VAULT</text>
  <rect class="panel" x="448" y="75.6" width="196" height="230.4" rx="14.4"/>

  <use href="#folder" x="464.5" y="115.35" width="12" height="9.75"/>
  <text class="file mono" x="484" y="123.6">10-Projects/</text>

  <path class="tree" d="M470.5 128.1V152.25h12"/>
  <use href="#folder" x="485.5" y="147.75" width="12" height="9.75"/>
  <text class="file mono" x="505" y="156">your-project/</text>

  <path class="tree" d="M491.5 162V258.45"/>
  <path class="tree" d="M491.5 190.05h12M491.5 224.25h12M491.5 258.45h12"/>

  <use href="#folder" x="506.5" y="185.55" width="12" height="9.75"/>
  <text class="file mono" x="526" y="193.8">plans/</text>

  <use href="#folder" x="506.5" y="219.75" width="12" height="9.75"/>
  <text class="file mono" x="526" y="228">notes/</text>

  <use href="#folder" x="506.5" y="253.95" width="12" height="9.75"/>
  <text class="file mono" x="526" y="262.2">logs/</text>

  <path class="rule" d="M36 342h608"/>
  <text class="caption" x="340" y="390.6" text-anchor="middle">Any agent. One vault. Only when you ask.</text>
</svg>
