packages:
  - "apps/*"
  - "deploy/*"
  - "packages/*"
  - "services/*"

# Shared versions pinned once, referenced as "catalog:" by every package.
catalog:
  astro: ^7.3.3
  eslint: ^10.11.0
  "@eslint/js": ^10.0.1
  turbo: ^2.11.2
  typescript: ^6.0.3
  typescript-eslint: ^8.70.0
  wrangler: ^4.135.0

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - eslint@10.11.0
  - turbo@2.11.2
